[package]
name = "qcortado"
version = "0.2.0"
description = "A modern UI for Quantum ESPRESSO"
authors = ["Jake Scally"]
edition = "2021"

[features]
default = []
viewer = []

[lib]
name = "qcortado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
thiserror = "1"
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
flate2 = "1"
spglib-sys = "1.16.1"
nalgebra = "0.33"
num-complex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
spglib-sys = { path = "vendor/spglib-sys" }
